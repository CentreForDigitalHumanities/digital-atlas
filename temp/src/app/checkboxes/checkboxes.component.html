<div class="field is-grouped is-grouped-centered has-text-weight-bold">
  @for (i of indices; track i) {
    <div class="control">
      <label class="checkbox" class="is-clickable is-{{color(i)}}" (click)="toggleItem(i)">
        <span class="icon checkbox-box" [ngClass]="{'checked': selectedIndices ? selectedIndices[i] : false}">
          <fa-icon [icon]="icon(i)"></fa-icon>
        </span>
        {{label(i)}}
      </label>
    </div>
  }
</div>
