@if (event) {
  <div class="panel is-{{color}}">
    <div class="panel-heading" [ngClass]="{'is-clickable': selected}" (click)="selected && goBack.next(undefined)">
      <div class="columns">
        <div class="column" [innerHtml]="event.title || '...' | highlight:searchText">
        </div>
        <div class="column is-narrow">
          @if (selected) {
            <span class="icon back-button" pTooltip="go back">
              <fa-icon [icon]="faEllipsisV"></fa-icon>
            </span>
          }
        </div>
      </div>
    </div>
    @for (author of authors; track author) {
      <div class="panel-block author-link is-clickable"
        [routerLink]="['/intellectual', author.info.id]">
        <div class="column author-name has-text-right" [innerHtml]="author.info.name | highlight:searchText">
        </div>
        <div class="column is-narrow">
          @if (author.picture) {
            <figure class="image is-square is-32x32 author-image">
              <img class="is-rounded is-{{author.color}}" [src]="author.picture">
            </figure>
          }
        </div>
      </div>
    }
    @if (picture) {
      <div class="panel-block">
        <figure class="image">
          <img [src]="picture" alt="" class="is-radiusless">
        </figure>
      </div>
    }
    @if (event.description) {
      <div class="panel-block description">
        <div class="content">
          <p [innerHtml]="event.description | highlight:searchText"></p>
        </div>
      </div>
    }
    @if (formattedUrl) {
      <a class="panel-block link" [href]="event.url" target="_blank">
        <span class="panel-icon">
          <fa-icon [icon]="faLink"></fa-icon>
        </span>
        {{formattedUrl}}
      </a>
    }
    @if (categoryIcon) {
      <p class="panel-block">
        <span class="panel-icon">
          <fa-icon [icon]="categoryIcon"></fa-icon>
        </span>
        <span [innerHtml]="event.type | titlecase | highlight:searchText"></span>
      </p>
    }
    @if (formattedDate) {
      <p class="panel-block">
        <span class="panel-icon">
          <fa-icon [icon]="faCalendar"></fa-icon>
        </span>
        <span [innerHtml]="formattedDate | highlight:searchText"></span>
      </p>
    }
    @if (event.where) {
      <p class="panel-block">
        <span class="panel-icon">
          <fa-icon [icon]="faMapMarker"></fa-icon>
        </span>
        <span [innerHtml]="event.where?.name | highlight:searchText"></span>
      </p>
    }
  </div>
}
