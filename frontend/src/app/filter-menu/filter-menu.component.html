<div class="filter-menu" [ngClass]="{'above-footer': aboveFooter}">
  <div class="columns">
    <div class="column is-narrow prev-column">
      <button class="button is-rounded is-dark" [ngClass]="{'is-invisible': !showPrevButton}" matTooltip="go to previous event" (click)="triggerJump('previous')">
        <span class="icon">
          <fa-icon [icon]="faArrowLeft">previous</fa-icon>
        </span>
      </button>
    </div>
    <div class="column checkboxes-column" [ngClass]="{ 'is-narrow': dateRange }"
      matTooltip="Filter the events by their type" matTooltipPosition="above">
      <da-checkboxes [options]="categories" [icons]="eventIcons"
        (selection)="selectedCategories = $event; emitFilters()">
      </da-checkboxes>
    </div>

    @if (dateRange) {
      <div class="column years-column" matTooltip="Filter the events by year" matTooltipPosition="above"
        style="padding-top: 0">
        <div class="control">
                <mat-slider [min]="minYear" [max]="maxYear">
                    <input name="range-start" matSliderStartThumb [(ngModel)]="selectedMin"
                        (dragEnd)="emitFilters()">
                    <input name="range-end" matSliderEndThumb  [(ngModel)]="selectedMax"
                        (dragEnd)="emitFilters()">
                </mat-slider>
        </div>
        <div class="columns has-text-weight-bold">
            <div class="column" style="padding-top: 0">{{selectedMin}}</div>
            <div class="column" style="padding-top: 0; text-align: right;">{{selectedMax}}</div>
        </div>
      </div>
    }
    <div class="column next-column is-narrow">
      <button class="button button-next is-rounded is-dark" [ngClass]="{'is-invisible': !showNextButton}"
        matTooltip="go to next event"
        (click)="triggerJump('next')">
        <span class="icon">
          <fa-icon [icon]="faArrowRight">next</fa-icon>
        </span>
      </button>
    </div>
  </div>
</div>
