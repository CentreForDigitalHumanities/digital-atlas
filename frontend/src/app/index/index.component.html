@let authorsCurrent = authors();
@let picturesCurrent = pictures();
<div class="section">
  <div class="container">
    @if (authorsCurrent) {
      <div class="columns is-multiline is-centered">
        @for (author of authorsCurrent; track author.id) {
          <div class="column is-2">
            <div class="card is-radiusless is-{{author.color || 'blank'}}" [routerLink]="['/intellectual', author.id]">
              <header class="card-header">
                <p class="card-header-title">
                  {{author.name}}
                </p>
              </header>
              @if (picturesCurrent && picturesCurrent[author.name]) {
                <div class="card-image">
                  <figure class="image is-square">
                    <img [src]="picturesCurrent[author.name]" alt="" class="is-radiusless">
                  </figure>
                </div>
              }
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
