<da-intellectual-menu (selectedAuthors)="selectedAuthors = $event; updateFilteredData();"></da-intellectual-menu>

<da-map [data]="filteredData" #map (showPrevButton)="showPrevButton=$event" (showNextButton)="showNextButton=$event">
</da-map>

<da-filter-menu
    [dateRange]="(minYear !== undefined && maxYear !== undefined) ? [minYear, maxYear] : undefined"
    [showPrevButton]="showPrevButton" [showNextButton]="showNextButton"
    [aboveFooter]="true" (jump)="jump($event)" (filter)="setFilter($event)">
</da-filter-menu>
